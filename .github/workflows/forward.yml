name: X to DingTalk

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forwarder
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_KEYWORD: ${{ secrets.DINGTALK_KEYWORD }}
          TWITTER_ACCOUNTS: ${{ secrets.TWITTER_ACCOUNTS }}
        run: |
          echo "Checking secrets..."
          MISSING=0
          [ -n "$TWITTER_AUTH_TOKEN" ] && echo "TWITTER_AUTH_TOKEN: OK" || { echo "::error::TWITTER_AUTH_TOKEN is MISSING!"; MISSING=1; }
          [ -n "$DINGTALK_WEBHOOK" ] && echo "DINGTALK_WEBHOOK: OK" || { echo "::error::DINGTALK_WEBHOOK is MISSING!"; MISSING=1; }
          [ -n "$DINGTALK_KEYWORD" ] && echo "DINGTALK_KEYWORD: OK" || { echo "::error::DINGTALK_KEYWORD is MISSING!"; MISSING=1; }
          [ -n "$TWITTER_ACCOUNTS" ] && echo "TWITTER_ACCOUNTS: OK ($TWITTER_ACCOUNTS)" || { echo "::error::TWITTER_ACCOUNTS is MISSING!"; MISSING=1; }
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Required secret(s) missing, aborting before any containers are started."
            exit 1
          fi

      - name: Create Docker network
        run: docker network create rss-net

      - name: Start Browserless
        run: |
          docker run -d --name browserless \
            --network rss-net \
            --shm-size=1gb \
            browserless/chrome

      - name: Start RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          docker run -d --name rsshub \
            --network rss-net \
            -e TWITTER_AUTH_TOKEN="$TWITTER_AUTH_TOKEN" \
            -e PUPPETEER_WS_ENDPOINT=ws://browserless:3000 \
            -p 1200:1200 \
            diygod/rsshub:latest

      - name: Wait for services
        run: |
          echo "Waiting for Browserless..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/pressure > /dev/null 2>&1; then
              echo "Browserless is ready (attempt $i)"
              break
            fi
            sleep 2
          done
          echo "Waiting for RSSHub..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1200/healthz > /dev/null 2>&1; then
              echo "RSSHub is ready (attempt $i)"
              break
            fi
            sleep 2
          done
          echo "=== RSSHub logs ==="
          docker logs rsshub 2>&1 | tail -30

      - name: Test RSSHub Twitter route
        run: |
          echo "Testing Twitter route for alpha123cc..."
          HTTP_CODE=$(curl -s -o /tmp/rss_output -w "%{http_code}" "http://localhost:1200/twitter/user/alpha123cc")
          echo "HTTP status: $HTTP_CODE"
          echo "Response, HTML tags stripped (first 3000 chars):"
          sed -e 's/<[^>]*>/ /g' /tmp/rss_output | tr -s ' \t\n' ' ' | head -c 3000
          echo ""
          echo "=== RSSHub container logs (post-request) ==="
          docker logs rsshub 2>&1 | tail -60
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Twitter auth_token appears to be expired or invalid (HTTP $HTTP_CODE). Update the TWITTER_AUTH_TOKEN secret."
            exit 1
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Unexpected HTTP status $HTTP_CODE from RSSHub. May or may not be an auth_token issue, check logs above."
          else
            echo "Twitter auth_token looks valid."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_KEYWORD: ${{ secrets.DINGTALK_KEYWORD }}
          TWITTER_ACCOUNTS: ${{ secrets.TWITTER_ACCOUNTS }}
        run: |
          mkdir -p data
          DINGTALK_WEBHOOK="$DINGTALK_WEBHOOK" \
          DINGTALK_KEYWORD="$DINGTALK_KEYWORD" \
          TWITTER_ACCOUNTS="$TWITTER_ACCOUNTS" \
          python -c "
          import json, os
          config = {
              'rsshub_url': 'http://localhost:1200',
              'accounts': [a.strip() for a in os.environ['TWITTER_ACCOUNTS'].split(',') if a.strip()],
              'dingtalk': {
                  'webhook': os.environ['DINGTALK_WEBHOOK'],
                  'secret': '',
                  'keyword': os.environ['DINGTALK_KEYWORD']
              },
              'poll_interval_minutes': 5,
              'send_on_first_run': True,
              'state_file': 'data/state.json',
              'max_state_entries': 200,
              'message_type': 'markdown',
              'proxy': ''
          }
          with open('config.json', 'w') as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
          print('config.json created')
          print('Accounts:', config['accounts'])
          "

      - name: Run forwarder
        run: python main.py --once

      - name: Save state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/state.json ]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions Bot"
            git add data/state.json
            git commit -m "chore: update tweet state" || echo "No state changes"
            if ! git push; then
              echo "::error::Failed to push updated state.json — next run may re-send duplicate tweets."
              exit 1
            fi
          else
            echo "No state file created"
          fi

      - name: Cleanup
        if: always()
        run: |
          docker stop rsshub 2>/dev/null || true
          docker stop browserless 2>/dev/null || true
          docker network rm rss-net 2>/dev/null || true
